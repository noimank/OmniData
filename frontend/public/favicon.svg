<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67C23A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="32" height="32" rx="6" fill="url(#favBg)"/>

  <!-- 数据中心点 -->
  <circle cx="16" cy="16" r="4" fill="#ffffff" opacity="0.95"/>

  <!-- 8个方向的数据点 -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="16" cy="5" r="1.5"/>
    <circle cx="25" cy="21" r="1.5"/>
    <circle cx="25" cy="11" r="1.5"/>
    <circle cx="7" cy="21" r="1.5"/>
    <circle cx="7" cy="11" r="1.5"/>
    <circle cx="16" cy="27" r="1.5"/>
    <circle cx="27" cy="16" r="1.5"/>
    <circle cx="5" cy="16" r="1.5"/>
  </g>

  <!-- 连接线 -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="16" y1="16" x2="16" y2="5"/>
    <line x1="16" y1="16" x2="25" y2="21"/>
    <line x1="16" y1="16" x2="25" y2="11"/>
    <line x1="16" y1="16" x2="7" y2="21"/>
    <line x1="16" y1="16" x2="7" y2="11"/>
    <line x1="16" y1="16" x2="16" y2="27"/>
    <line x1="16" y1="16" x2="27" y2="16"/>
    <line x1="16" y1="16" x2="5" y2="16"/>
  </g>
</svg>
