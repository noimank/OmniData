name: Build and Push Docker Image

on:
  push:
    branches:
      - main

env:
  # 镜像标签
  IMAGE_TAG: server.c2m.fun:8848/noimank/omnidata/omnidata:latest
  # Dockerfile 路径
  DOCKERFILE: ./Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          install: false

      - name: Log in to Docker Registry
        run: |
          # 从 IMAGE_TAG 中提取 registry 地址进行登录
          REGISTRY_ADDR=$(echo "$IMAGE_TAG" | cut -d'/' -f1)
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login $REGISTRY_ADDR -u ${{ secrets.DOCKER_REGISTRY_USER }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --tag $IMAGE_TAG \
            --file $DOCKERFILE \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_TAG
