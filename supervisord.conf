[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --port 6379
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=100
stopwaitsecs=10

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=150
stopwaitsecs=5

[program:omnidata]
command=uv run uvicorn omnidata.api.main:app --host 0.0.0.0 --port 8380
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omnidata.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=200
stopwaitsecs=30
